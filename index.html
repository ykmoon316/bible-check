<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff4f0">
<title>성경 읽기 체크</title>
<style>
  :root {
    --bg: #fff8f3;
    --card: #ffffff;
    --ink: #4a3f45;
    --sub: #9a8b92;
    --line: #f3e3dc;
    --accent: #ff9eb5;
    --accent2: #ffc9a8;
    --shadow: 0 3px 10px rgba(255, 158, 181, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Nanum Gothic', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* 상단 */
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(255, 248, 243, .94);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 2px dashed var(--line);
    padding: 10px 14px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  header h1 { font-size: 20px; margin: 0 6px 0 0; letter-spacing: -0.5px; }
  select, button {
    font-family: inherit; font-size: 15px; color: var(--ink);
    padding: 7px 12px; border-radius: 999px;
    border: 2px solid var(--line); background: var(--card);
    box-shadow: var(--shadow);
  }
  select { max-width: 150px; }
  button { cursor: pointer; }
  button:active { transform: scale(.96); }
  .spacer { flex: 1; }
  .mini-btn { font-size: 13px; padding: 6px 10px; box-shadow: none; }

  .tabs { display: flex; gap: 8px; padding: 12px 14px 0; }
  .tabs button { flex: 1; box-shadow: none; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--shadow); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    padding: 10px 14px 4px; font-size: 12px; color: var(--sub);
  }
  .legend .sw {
    display: inline-block; min-width: 24px; height: 18px; padding: 0 4px;
    border-radius: 999px; text-align: center; font-size: 11px; line-height: 17px;
    border: 1px solid rgba(0,0,0,.08);
  }

  .summary { padding: 12px 16px 6px; font-size: 15px; }
  .bar { height: 12px; background: #ffe9e2; border-radius: 999px; margin: 0 16px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ffc9a8, #ff9eb5); transition: width .35s; }

  /* 장 바로가기 */
  .jump { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 14px 0; }
  .jb {
    min-width: 34px; height: 30px; padding: 0 8px; border-radius: 999px;
    border: 1.5px solid rgba(0,0,0,.08); font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* 한 권 보기 */
  .chapter {
    margin: 14px 12px 0; padding: 12px 12px 14px;
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    scroll-margin-top: 76px;
  }
  .chapter h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .chapter h2::before { content: '🌱'; font-size: 15px; }
  .chapter h2 .mini { font-size: 12px; font-weight: 400; color: var(--sub); margin-left: auto; }

  /* 절 칸: 기존 64px → 38px (약 40% 축소) */
  .verses { display: grid; grid-template-columns: repeat(auto-fill, 38px); gap: 5px; }
  .v {
    width: 38px; height: 38px; border-radius: 12px;
    border: 1.5px solid rgba(0,0,0,.07);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
    transition: transform .08s;
  }
  .v:active { transform: scale(.88); }
  .v .n { font-size: 14px; line-height: 1; }
  .v .c { font-size: 9px; line-height: 1; margin-top: 2px; min-height: 9px; opacity: .85; }
  .bottom-space { height: 60px; }

  /* 전체 현황 */
  .total {
    margin: 14px 12px 0; padding: 16px; border-radius: 22px; text-align: center;
    background: linear-gradient(135deg, #ffe3ec, #ffeede); box-shadow: var(--shadow);
  }
  .total .big { font-size: 24px; }
  .total .sub { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .total .bar { margin: 12px 0 0; background: rgba(255,255,255,.7); }
  .group-title { padding: 18px 18px 0; font-size: 17px; }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 10px 12px 14px; }
  .bk {
    border-radius: 18px; padding: 11px 12px; cursor: pointer;
    border: 1.5px solid rgba(0,0,0,.07); box-shadow: var(--shadow);
  }
  .bk:active { transform: scale(.97); }
  .bk .t { font-size: 15px; }
  .bk .s { font-size: 11px; margin-top: 3px; opacity: .85; }
  .bk .pb { height: 7px; border-radius: 999px; background: rgba(0,0,0,.1); margin-top: 8px; overflow: hidden; }
  .bk .pb > div { height: 100%; border-radius: 999px; background: #ff9eb5; }

  /* 숫자 입력 창 */
  dialog { border: none; border-radius: 24px; padding: 22px; width: 300px; box-shadow: 0 12px 40px rgba(120, 80, 90, .3); background: var(--card); color: var(--ink); font-family: inherit; }
  dialog::backdrop { background: rgba(74, 63, 69, .35); }
  dialog input { width: 100%; font-family: inherit; font-size: 26px; padding: 10px; text-align: center; margin: 12px 0; border-radius: 16px; border: 2px solid var(--line); color: var(--ink); }
  dialog .row { display: flex; gap: 8px; }
  dialog .row button { flex: 1; }
  dialog .ok { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
</head>

<header>
  <h1>🌸 성경 읽기 체크</h1>
  <select id="bookSel"></select>
  <span class="spacer"></span>
  <button id="exportBtn" class="mini-btn">내보내기</button>
  <button id="importBtn" class="mini-btn">불러오기</button>
  <input type="file" id="importFile" accept="application/json" style="display:none">
</header>

<div class="tabs">
  <button id="tabBook" class="on">📖 한 권 보기</button>
  <button id="tabAll">🌈 전체 현황</button>
</div>

<div class="legend" id="legend"></div>

<!-- 한 권 보기 -->
<div id="bookView">

  <div class="bar"><div id="barFill"></div></div>

  <div id="chapters"></div>
  <div class="bottom-space"></div>

<!-- 전체 현황 -->

    <div class="sub" id="totalSub"></div>
    <div class="bar"><div id="totalBar"></div></div>

  <div class="group-title">🌷 신약</div>
  <div class="books" id="ntBooks"></div>
  <div class="bottom-space"></div>
</div>

<dialog id="dlg">
  <div id="dlgTitle"></div>
  <input type="number" id="dlgInput" min="0" inputmode="numeric">
  <div class="row">
    <button id="dlgCancel">취소</button>
    <button id="dlgOk" class="ok">확인</button>

const COLORS = [

  {bg:'#e4f6d9', fg:'#4a3f45'},   // 1 연두

const colorOf = n => COLORS[Math.min(n, 10)];

// ===== 저장소 (기존 기록 그대로 사용) =====
const KEY = 'bibleReadingChecks_v1';
let data = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => localStorage.setItem(KEY, JSON.stringify(data));
const k = (b, c, v) => `${b}.${c}.${v}`;
const getCount = (b, c, v) => data[k(b, c, v)] || 0;
function setCount(b, c, v, n) {
  if (n <= 0) delete data[k(b, c, v)]; else data[k(b, c, v)] = n;
  save();
}

// ===== 상태 =====
let book = Number(localStorage.getItem('lastBook') || 0);
const $ = id => document.getElementById(id);
const bookSel = $('bookSel');
BIBLE.forEach((b, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = b[0];

});

// 범례

  for (let i = 0; i <= 10; i++) {

// ===== 통계 계산 =====
function chapterStats(b, ci) {
  const cnt = BIBLE[b][1][ci];
  let read = 0, min = Infinity, sum = 0;
  for (let v = 1; v <= cnt; v++) {
    const n = getCount(b, ci, v);
    if (n > 0) read++;
    if (n < min) min = n;
    sum += n;
  }
  return {read, total: cnt, min: min === Infinity ? 0 : min, sum};
}
function bookStats(b) {
  let read = 0, total = 0, min = Infinity, sum = 0;
  BIBLE[b][1].forEach((_, ci) => {
    const s = chapterStats(b, ci);
    read += s.read; total += s.total; sum += s.sum;
    if (s.min < min) min = s.min;
  });
  return {read, total, min: min === Infinity ? 0 : min, sum};
}

// ===== 한 권 보기 =====
function paint(el, n) {
  const c = colorOf(n);
  el.style.background = c.bg;
  el.style.color = c.fg;
  el.querySelector('.c').textContent = n > 0 ? n : '';
}

function makeVerse(b, ci, v, onChange) {
  const el = document.createElement('div');
  el.className = 'v';
  el.innerHTML = `<div class="n">${v}</div><div class="c"></div>`;
  paint(el, getCount(b, ci, v));

  let timer = null, long = false;
  const start = () => {
    long = false;
    timer = setTimeout(() => {
      long = true;
      openDialog(`${BIBLE[b][0]} ${ci + 1}:${v}`, getCount(b, ci, v), n => {
        setCount(b, ci, v, n);
        paint(el, n);
        onChange();
      });
    }, 500);
  };
  const end = () => {
    clearTimeout(timer);
    if (!long) {
      const n = getCount(b, ci, v) + 1;
      setCount(b, ci, v, n);
      paint(el, n);
      onChange();
    }
  };
  const cancel = () => { clearTimeout(timer); long = true; };

  el.addEventListener('touchstart', e => { e.preventDefault(); start(); }, {passive: false});
  el.addEventListener('touchend', e => { e.preventDefault(); end(); });
  el.addEventListener('touchmove', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
  return el;
}

function renderBookSummary() {
  const s = bookStats(book);
  const pct = s.total ? Math.round(s.read / s.total * 100) : 0;
  $('summary').textContent = `${BIBLE[book][0]} · ${s.read}/${s.total}절 (${pct}%) · 누적 ${s.sum}회`;
  $('barFill').style.width = pct + '%';
}

function refreshChapterHeader(ci) {
  const s = chapterStats(book, ci);
  const mini = document.getElementById('mini-' + ci);
  if (mini) mini.textContent = `${s.read}/${s.total}절`;
  const jb = document.getElementById('jb-' + ci);
  if (jb) {
    const c = colorOf(s.min);
    jb.style.background = c.bg;
    jb.style.color = c.fg === '#c9bcc2' ? '#9a8b92' : c.fg;
  }
}

function renderBook() {
  const [name, chapters] = BIBLE[book];
  const jump = $('jump');
  const box = $('chapters');
  jump.innerHTML = '';
  box.innerHTML = '';

  chapters.forEach((cnt, ci) => {
    const jb = document.createElement('div');
    jb.className = 'jb';
    jb.id = 'jb-' + ci;
    jb.textContent = ci + 1;
    jb.onclick = () => {
      document.getElementById('ch-' + ci).scrollIntoView({behavior: 'smooth'});
    };
    jump.appendChild(jb);

    const sec = document.createElement('div');
    sec.className = 'chapter';
    sec.id = 'ch-' + ci;
    sec.innerHTML = `<h2>${name} ${ci + 1}장 <span class="mini" id="mini-${ci}"></span></h2>`;
    const grid = document.createElement('div');
    grid.className = 'verses';
    for (let v = 1; v <= cnt; v++) {
      grid.appendChild(makeVerse(book, ci, v, () => {
        refreshChapterHeader(ci);
        renderBookSummary();
      }));
    }
    sec.appendChild(grid);
    box.appendChild(sec);
    refreshChapterHeader(ci);
  });
  renderBookSummary();
}

// ===== 전체 현황 =====
function renderAll() {
  let gRead = 0, gTotal = 0, gSum = 0, booksDone = 0;
  const ot = $('otBooks'), nt = $('ntBooks');
  ot.innerHTML = ''; nt.innerHTML = '';

  BIBLE.forEach((b, bi) => {
    const s = bookStats(bi);
    gRead += s.read; gTotal += s.total; gSum += s.sum;
    if (s.read === s.total) booksDone++;
    const pct = s.total ? Math.round(s.read / s.total * 100) : 0;
    const c = colorOf(s.min);
    const el = document.createElement('div');
    el.className = 'bk';
    el.style.background = c.bg;
    el.style.color = c.fg === '#c9bcc2' ? '#4a3f45' : c.fg;
    el.innerHTML = `<div class="t">${b[0]}</div>` +
      `<div class="s">${pct}% · ${s.read}/${s.total}절</div>` +
      `<div class="pb"><div style="width:${pct}%"></div></div>`;
    el.onclick = () => {
      book = bi;
      bookSel.value = bi;
      localStorage.setItem('lastBook', bi);
      showTab('book');
      renderBook();
      window.scrollTo(0, 0);
    };
    (bi < OT_COUNT ? ot : nt).appendChild(el);
  });

  const pct = gTotal ? (gRead / gTotal * 100) : 0;
  $('totalBig').textContent = `성경 전체 ${pct.toFixed(1)}% 읽었어요 ✨`;
  $('totalSub').textContent = `${gRead.toLocaleString()} / ${gTotal.toLocaleString()}절 · 완독한 권 ${booksDone}/66 · 누적 ${gSum.toLocaleString()}회`;
  $('totalBar').style.width = pct + '%';
}

function showTab(t) {
  $('bookView').style.display = t === 'book' ? '' : 'none';
  $('allView').style.display = t === 'all' ? '' : 'none';
  $('tabBook').classList.toggle('on', t === 'book');
  $('tabAll').classList.toggle('on', t === 'all');
  if (t === 'all') renderAll();
}

// ===== 숫자 입력 창 =====
let dlgCb = null;
function openDialog(title, cur, cb) {
  $('dlgTitle').textContent = title + ' 읽은 횟수 (0이면 해제)';
  $('dlgInput').value = cur;
  dlgCb = cb;
  $('dlg').showModal();
  setTimeout(() => $('dlgInput').select(), 50);
}
$('dlgCancel').onclick = () => $('dlg').close();
$('dlgOk').onclick = () => {
  const n = Math.max(0, parseInt($('dlgInput').value, 10) || 0);
  $('dlg').close();
  if (dlgCb) dlgCb(n);
};

// ===== 이벤트 =====
bookSel.onchange = () => {
  book = Number(bookSel.value);
  localStorage.setItem('lastBook', book);
  showTab('book');
  renderBook();
  window.scrollTo(0, 0);
};
$('tabBook').onclick = () => { showTab('book'); };
$('tabAll').onclick = () => { showTab('all'); };

// 내보내기 / 불러오기
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bible-check-backup.json';
  a.click();
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (confirm('현재 기록을 이 파일의 내용으로 바꿉니다. 계속할까요?')) {
        data = obj; save(); renderBook();
        if ($('allView').style.display !== 'none') renderAll();
      }
    } catch (err) { alert('파일을 읽을 수 없습니다.'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

// 시작
bookSel.value = book;
renderBook();
</script>
</body>
</html>
