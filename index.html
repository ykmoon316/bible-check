<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>성경 읽기 체크</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #f5f5f4; color: #222; }
  header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #ddd; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  select, button { font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid #bbb; background: #fff; }
  button { cursor: pointer; }
  .spacer { flex: 1; }
  .tabs { display: flex; gap: 6px; padding: 10px 14px 0; }
  .tabs button.on { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
  .summary { padding: 8px 14px; font-size: 15px; color: #444; }
  .bar { height: 8px; background: #ddd; border-radius: 4px; margin: 0 14px; overflow: hidden; }
  .bar > div { height: 100%; background: #2e8b57; width: 0; transition: width .3s; }
  .chapnav { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
  .chapnav .title { font-size: 20px; font-weight: 700; flex: 1; text-align: center; }
  .verses { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; padding: 6px 14px 30px; }
  .v { position: relative; height: 64px; border-radius: 10px; border: 1px solid rgba(0,0,0,.12); display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .v .n { font-size: 18px; font-weight: 600; }
  .v .c { font-size: 12px; opacity: .85; min-height: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; font-size: 12px; align-items: center; }
  .legend span.sw { display: inline-block; width: 22px; height: 16px; border-radius: 4px; text-align: center; font-size: 11px; line-height: 16px; }
  .chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; padding: 6px 14px 30px; }
  .ch { height: 56px; border-radius: 10px; border: 1px solid rgba(0,0,0,.12); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ch .n { font-weight: 600; }
  .ch .p { font-size: 11px; opacity: .85; }
  dialog { border: none; border-radius: 14px; padding: 20px; width: 300px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  dialog input { width: 100%; font-size: 24px; padding: 10px; text-align: center; margin: 10px 0; border-radius: 8px; border: 1px solid #bbb; }
  dialog .row { display: flex; gap: 8px; }
  dialog .row button { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>성경 읽기 체크</h1>
  <select id="bookSel"></select>
  <span class="spacer"></span>
  <button id="exportBtn">내보내기</button>
  <button id="importBtn">불러오기</button>
  <input type="file" id="importFile" accept="application/json" style="display:none">
</header>

<div class="summary" id="summary"></div>
<div class="bar"><div id="barFill"></div></div>

<div class="legend" id="legend"></div>

<div class="tabs">
  <button id="tabVerse" class="on">절 체크</button>
  <button id="tabBook">이 권의 장별 현황</button>
</div>

<div id="verseView">
  <div class="chapnav">
    <button id="prev">◀</button>
    <div class="title" id="chTitle"></div>
    <button id="next">▶</button>
  </div>
  <div class="verses" id="verses"></div>
</div>
<div id="bookView" style="display:none">
  <div class="chgrid" id="chgrid"></div>
</div>

<dialog id="dlg">
  <div id="dlgTitle" style="font-weight:700"></div>
  <input type="number" id="dlgInput" min="0" inputmode="numeric">
  <div class="row">
    <button id="dlgCancel">취소</button>
    <button id="dlgOk" style="background:#1e3a5f;color:#fff">확인</button>
  </div>
</dialog>

<script>
// ===== 개역한글 장별 절 수 (66권, 1,189장, 31,102절) =====
const BIBLE = [
["창세기",[31,25,24,26,32,22,24,22,29,32,32,20,18,24,21,16,27,33,38,18,34,24,20,67,34,35,46,22,35,43,55,32,20,31,29,43,36,30,23,23,57,38,34,34,28,34,31,22,33,26]],

["레위기",[17,16,17,35,19,30,38,36,24,20,47,8,59,57,33,34,16,30,37,27,24,33,44,23,55,46,34]],
["민수기",[54,34,51,49,31,27,89,26,23,36,35,16,33,45,41,50,13,32,22,29,35,41,30,25,18,65,23,31,40,16,54,42,56,29,34,13]],
["신명기",[46,37,29,49,33,25,26,20,29,22,32,32,18,29,23,22,20,22,21,20,23,30,25,22,19,19,26,68,29,20,30,52,29,12]],
["여호수아",[18,24,17,24,15,27,26,35,27,43,23,24,33,15,63,10,18,28,51,9,45,34,16,33]],
["사사기",[36,23,31,24,31,40,25,35,57,18,40,15,25,20,20,31,13,31,30,48,25]],
["룻기",[22,23,18,22]],
["사무엘상",[28,36,21,22,12,21,17,22,27,27,15,25,23,52,35,23,58,30,24,42,15,23,29,22,44,25,12,25,11,31,13]],
["사무엘하",[27,32,39,12,25,23,29,18,13,19,27,31,39,33,37,23,29,33,43,26,22,51,39,25]],
["열왕기상",[53,46,28,34,18,38,51,66,28,29,43,33,34,31,34,34,24,46,21,43,29,53]],
["열왕기하",[18,25,27,44,27,33,20,29,37,36,21,21,25,29,38,20,41,37,37,21,26,20,37,20,30]],
["역대상",[54,55,24,43,26,81,40,40,44,14,47,40,14,17,29,43,27,17,19,8,30,19,32,31,31,32,34,21,30]],
["역대하",[17,18,17,22,14,42,22,18,31,19,23,16,22,15,19,14,19,34,11,37,20,12,21,27,28,23,9,27,36,27,21,33,25,33,27,23]],
["에스라",[11,70,13,24,17,22,28,36,15,44]],
["느헤미야",[11,20,32,23,19,19,73,18,38,39,36,47,31]],
["에스더",[22,23,15,17,14,14,10,17,32,3]],
["욥기",[22,13,26,21,27,30,21,22,35,22,20,25,28,22,35,22,16,21,29,29,34,30,17,25,6,14,23,28,25,31,40,22,33,37,16,33,24,41,30,24,34,17]],
["시편",[6,12,8,8,12,10,17,9,20,18,7,8,6,7,5,11,15,50,14,9,13,31,6,10,22,12,14,9,11,12,24,11,22,22,28,12,40,22,13,17,13,11,5,26,17,11,9,14,20,23,19,9,6,7,23,13,11,11,17,12,8,12,11,10,13,20,7,35,36,5,24,20,28,23,10,12,20,72,13,19,16,8,18,12,13,17,7,18,52,17,16,15,5,23,11,13,12,9,9,5,8,28,22,35,45,48,43,13,31,7,10,10,9,8,18,19,2,29,176,7,8,9,4,8,5,6,5,6,8,8,3,18,3,3,21,26,9,8,24,13,10,7,12,15,21,10,20,14,9,6]],
["잠언",[33,22,35,27,23,35,27,36,18,32,31,28,25,35,33,33,28,24,29,30,31,29,35,34,28,28,27,28,27,33,31]],
["전도서",[18,26,22,16,20,12,29,17,18,20,10,14]],
["아가",[17,17,11,16,16,13,13,14]],
["이사야",[31,22,26,6,30,13,25,22,21,34,16,6,22,32,9,14,14,7,25,6,17,25,18,23,12,21,13,29,24,33,9,20,24,17,10,22,38,22,8,31,29,25,28,28,25,13,15,22,26,11,23,15,12,17,13,12,21,14,21,22,11,12,19,12,25,24]],
["예레미야",[19,37,25,31,31,30,34,22,26,25,23,17,27,22,21,21,27,23,15,18,14,30,40,10,38,24,22,17,32,24,40,44,26,22,19,32,21,28,18,16,18,22,13,30,5,28,7,47,39,46,64,34]],
["예레미야애가",[22,22,66,22,22]],
["에스겔",[28,10,27,17,17,14,27,18,11,22,25,28,23,23,8,63,24,32,14,49,32,31,49,27,17,21,36,26,21,26,18,32,33,31,15,38,28,23,29,49,26,20,27,31,25,24,23,35]],
["다니엘",[21,49,30,37,31,28,28,27,27,21,45,13]],
["호세아",[11,23,5,19,15,11,16,14,17,15,12,14,16,9]],
["요엘",[20,32,21]],
["아모스",[15,16,15,13,27,14,17,14,15]],
["오바댜",[21]],
["요나",[17,10,10,11]],
["미가",[16,13,12,13,15,16,20]],
["나훔",[15,13,19]],
["하박국",[17,20,19]],
["스바냐",[18,15,20]],
["학개",[15,23]],
["스가랴",[21,13,10,14,11,15,14,23,17,12,17,14,9,21]],
["말라기",[14,17,18,6]],
["마태복음",[25,23,17,25,48,34,29,34,38,42,30,50,58,36,39,28,27,35,30,34,46,46,39,51,46,75,66,20]],
["마가복음",[45,28,35,41,43,56,37,38,50,52,33,44,37,72,47,20]],
["누가복음",[80,52,38,44,39,49,50,56,62,42,54,59,35,35,32,31,37,43,48,47,38,71,56,53]],
["요한복음",[51,25,36,54,47,71,53,59,41,42,57,50,38,31,27,33,26,40,42,31,25]],
["사도행전",[26,47,26,37,42,15,60,40,43,48,30,25,52,28,41,40,34,28,41,38,40,30,35,27,27,32,44,31]],
["로마서",[32,29,31,25,21,23,25,39,33,21,36,21,14,23,33,27]],
["고린도전서",[31,16,23,21,13,20,40,13,27,33,34,31,13,40,58,24]],
["고린도후서",[24,17,18,18,21,18,16,24,15,18,33,21,14]],
["갈라디아서",[24,21,29,31,26,18]],
["에베소서",[23,22,21,32,33,24]],
["빌립보서",[30,30,21,23]],
["골로새서",[29,23,25,18]],
["데살로니가전서",[10,20,13,18,28]],
["데살로니가후서",[12,17,18]],
["디모데전서",[20,15,16,16,25,21]],
["디모데후서",[18,26,17,22]],
["디도서",[16,15,15]],
["빌레몬서",[25]],
["히브리서",[14,18,19,16,14,20,28,13,28,39,40,29,25]],
["야고보서",[27,26,18,17,20]],
["베드로전서",[25,25,22,19,14]],
["베드로후서",[21,22,18]],
["요한일서",[10,29,24,21,21]],
["요한이서",[13]],
["요한삼서",[14]],
["유다서",[25]],
["요한계시록",[20,29,22,11,14,17,17,13,21,11,19,17,18,20,8,21,18,24,21,15,27,21]]
];

// ===== 색상: 0회=회색, 1~10회=초록→진한 남색, 10회 이상은 같은 색 =====
const COLORS = [
  {bg:'#ffffff', fg:'#999'},   // 0
  {bg:'#d4edda', fg:'#222'},   // 1
  {bg:'#a8dcb5', fg:'#222'},   // 2
  {bg:'#7ccbc0', fg:'#222'},   // 3
  {bg:'#56b4d3', fg:'#222'},   // 4
  {bg:'#3a93d1', fg:'#fff'},   // 5
  {bg:'#3a6fc4', fg:'#fff'},   // 6
  {bg:'#4b55b5', fg:'#fff'},   // 7
  {bg:'#5a3fa0', fg:'#fff'},   // 8
  {bg:'#4a2f85', fg:'#fff'},   // 9
  {bg:'#1e2a5e', fg:'#fff'}    // 10+
];
const colorOf = n => COLORS[Math.min(n, 10)];

// ===== 저장소 =====
const KEY = 'bibleReadingChecks_v1';
let data = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => localStorage.setItem(KEY, JSON.stringify(data));
const k = (b, c, v) => `${b}.${c}.${v}`;
const getCount = (b, c, v) => data[k(b, c, v)] || 0;
function setCount(b, c, v, n) {
  if (n <= 0) delete data[k(b, c, v)]; else data[k(b, c, v)] = n;
  save();
}

// ===== 상태 =====
let book = Number(localStorage.getItem('lastBook') || 0);
let chap = Number(localStorage.getItem('lastChap') || 0);

const $ = id => document.getElementById(id);
const bookSel = $('bookSel');
BIBLE.forEach((b, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = b[0];
  bookSel.appendChild(o);
});

// 범례
(function() {
  const lg = $('legend');
  lg.append('읽은 횟수: ');
  for (let i = 0; i <= 10; i++) {
    const s = document.createElement('span');
    s.className = 'sw';
    s.style.background = COLORS[i].bg;
    s.style.color = COLORS[i].fg;
    s.style.border = '1px solid rgba(0,0,0,.15)';
    s.textContent = i === 10 ? '10+' : i;
    lg.appendChild(s);
  }
})();

function renderSummary() {
  let total = 0, read = 0, sum = 0;
  BIBLE[book][1].forEach((cnt, ci) => {
    for (let v = 1; v <= cnt; v++) {
      total++;
      const n = getCount(book, ci, v);
      if (n > 0) read++;
      sum += n;
    }
  });
  const pct = total ? Math.round(read / total * 100) : 0;
  $('summary').textContent = `${BIBLE[book][0]}: ${read} / ${total}절 읽음 (${pct}%) · 누적 ${sum}회`;
  $('barFill').style.width = pct + '%';
}

function renderVerses() {
  const [name, chapters] = BIBLE[book];
  if (chap >= chapters.length) chap = chapters.length - 1;
  if (chap < 0) chap = 0;
  $('chTitle').textContent = `${name} ${chap + 1}장`;
  const box = $('verses');
  box.innerHTML = '';
  for (let v = 1; v <= chapters[chap]; v++) {
    box.appendChild(makeVerse(v));
  }
  renderSummary();
}

function paint(el, n) {
  const c = colorOf(n);
  el.style.background = c.bg;
  el.style.color = c.fg;
  el.querySelector('.c').textContent = n > 0 ? n + '회' : '';
}

function makeVerse(v) {
  const el = document.createElement('div');
  el.className = 'v';
  el.innerHTML = `<div class="n">${v}</div><div class="c"></div>`;
  paint(el, getCount(book, chap, v));

  let timer = null, long = false;
  const start = () => {
    long = false;
    timer = setTimeout(() => {
      long = true;
      openDialog(`${BIBLE[book][0]} ${chap + 1}:${v}`, getCount(book, chap, v), n => {
        setCount(book, chap, v, n);
        paint(el, n);
        renderSummary();
      });
    }, 500);
  };
  const end = () => {
    clearTimeout(timer);
    if (!long) {
      const n = getCount(book, chap, v) + 1;
      setCount(book, chap, v, n);
      paint(el, n);
      renderSummary();
    }
  };
  const cancel = () => { clearTimeout(timer); long = true; };

  el.addEventListener('touchstart', e => { e.preventDefault(); start(); }, {passive: false});
  el.addEventListener('touchend', e => { e.preventDefault(); end(); });
  el.addEventListener('touchmove', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', e => e.preventDefault());
  return el;
}

function renderBook() {
  const [name, chapters] = BIBLE[book];
  const g = $('chgrid');
  g.innerHTML = '';
  chapters.forEach((cnt, ci) => {
    let min = Infinity, read = 0;
    for (let v = 1; v <= cnt; v++) {
      const n = getCount(book, ci, v);
      if (n > 0) read++;
      if (n < min) min = n;
    }
    // 장 전체 색 = 그 장에서 가장 적게 읽은 절의 횟수 (모든 절을 최소 N번 읽었다는 뜻)
    const c = colorOf(min);
    const el = document.createElement('div');
    el.className = 'ch';
    el.style.background = c.bg;
    el.style.color = c.fg;
    el.innerHTML = `<div class="n">${ci + 1}장</div><div class="p">${read}/${cnt}</div>`;
    el.onclick = () => { chap = ci; localStorage.setItem('lastChap', chap); showTab('verse'); renderVerses(); };
    g.appendChild(el);
  });
}

function showTab(t) {
  $('verseView').style.display = t === 'verse' ? '' : 'none';
  $('bookView').style.display = t === 'book' ? '' : 'none';
  $('tabVerse').classList.toggle('on', t === 'verse');
  $('tabBook').classList.toggle('on', t === 'book');
  if (t === 'book') renderBook();
}

// 숫자 입력 창
let dlgCb = null;
function openDialog(title, cur, cb) {
  $('dlgTitle').textContent = title + ' 읽은 횟수 (0이면 해제)';
  $('dlgInput').value = cur;
  dlgCb = cb;
  $('dlg').showModal();
  setTimeout(() => $('dlgInput').select(), 50);
}
$('dlgCancel').onclick = () => $('dlg').close();
$('dlgOk').onclick = () => {
  const n = Math.max(0, parseInt($('dlgInput').value, 10) || 0);
  $('dlg').close();
  if (dlgCb) dlgCb(n);
};

// 이벤트
bookSel.onchange = () => { book = Number(bookSel.value); chap = 0; localStorage.setItem('lastBook', book); localStorage.setItem('lastChap', chap); renderVerses(); if ($('bookView').style.display !== 'none') renderBook(); };
$('prev').onclick = () => {
  if (chap > 0) chap--;
  else if (book > 0) { book--; chap = BIBLE[book][1].length - 1; bookSel.value = book; }
  localStorage.setItem('lastBook', book); localStorage.setItem('lastChap', chap);
  renderVerses();
};
$('next').onclick = () => {
  if (chap < BIBLE[book][1].length - 1) chap++;
  else if (book < BIBLE.length - 1) { book++; chap = 0; bookSel.value = book; }
  localStorage.setItem('lastBook', book); localStorage.setItem('lastChap', chap);
  renderVerses();
};
$('tabVerse').onclick = () => showTab('verse');
$('tabBook').onclick = () => showTab('book');

// 내보내기 / 불러오기
$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bible-check-backup.json';
  a.click();
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (confirm('현재 기록을 이 파일의 내용으로 바꿉니다. 계속할까요?')) {
        data = obj; save(); renderVerses();
      }
    } catch (err) { alert('파일을 읽을 수 없습니다.'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

// 시작
bookSel.value = book;
renderVerses();
</script>
</body>
</html>
