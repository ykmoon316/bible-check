<title>성경 읽기 체크</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1726;
    --card: #272138;
    --ink: #f1e9f5;
    --sub: #a89bb8;
    --line: #3a3150;
    --accent: #ff8fb1;
    --accent2: #ffc09f;
    --shadow: 0 4px 14px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Nanum Gothic', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* 상단 */
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(27, 23, 38, .94);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 2px dashed var(--line);
    padding: 10px 14px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  header h1 { font-size: 20px; margin: 0 6px 0 0; letter-spacing: -0.5px; }
  select, button {
    font-family: inherit; font-size: 15px; color: var(--ink);
    padding: 7px 12px; border-radius: 999px;
    border: 2px solid var(--line); background: var(--card);
    box-shadow: var(--shadow);
  }
  select { max-width: 150px; }
  button { cursor: pointer; }
  button:active { transform: scale(.96); }
  .spacer { flex: 1; }
  .mini-btn { font-size: 13px; padding: 6px 10px; box-shadow: none; }

  .tabs { display: flex; gap: 8px; padding: 12px 14px 0; }
  .tabs button { flex: 1; box-shadow: none; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--shadow); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    padding: 10px 14px 4px; font-size: 12px; color: var(--sub);
  }
  .legend .sw {
    display: inline-block; min-width: 24px; height: 18px; padding: 0 4px;
    border-radius: 999px; text-align: center; font-size: 11px; line-height: 17px;
    border: 1px solid rgba(255,255,255,.12);
  }

  .summary { padding: 12px 16px 6px; font-size: 15px; }
  .bar { height: 12px; background: #3a3150; border-radius: 999px; margin: 0 16px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ffc9a8, #ff9eb5); transition: width .35s; }

  /* 장 바로가기 */
  .jump { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 14px 0; }
  .jb {
    min-width: 34px; height: 30px; padding: 0 8px; border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,.1); font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* 한 권 보기 */
  .chapter {
    margin: 14px 12px 0; padding: 12px 12px 14px;
    background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
    scroll-margin-top: 76px;
  }
  .chapter h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .chapter h2::before { content: '🌱'; font-size: 15px; }
  .chapter h2 .mini { font-size: 12px; font-weight: 400; color: var(--sub); margin-left: auto; }

  /* 절 칸: 기존 64px → 38px (약 40% 축소) */
  .verses { display: grid; grid-template-columns: repeat(auto-fill, 38px); gap: 5px; }
  .v {
    width: 38px; height: 38px; border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
    transition: transform .08s;
  }
  .v:active { transform: scale(.88); }
  .v .n { font-size: 14px; line-height: 1; }
  .v .c { font-size: 9px; line-height: 1; margin-top: 2px; min-height: 9px; opacity: .85; }
  .bottom-space { height: 60px; }

  /* 전체 현황 */
  .total {
    margin: 14px 12px 0; padding: 16px; border-radius: 22px; text-align: center;
    background: linear-gradient(135deg, #3b2a4d, #3d2d3f); box-shadow: var(--shadow);
  }
  .total .big { font-size: 24px; }
  .total .sub { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .total .bar { margin: 12px 0 0; background: rgba(0,0,0,.3); }
  .group-title { padding: 18px 18px 0; font-size: 17px; }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 10px 12px 14px; }
  .bk {
    border-radius: 18px; padding: 11px 12px; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,.1); box-shadow: var(--shadow);
  }
  .bk:active { transform: scale(.97); }
  .bk .t { font-size: 15px; }
  .bk .s { font-size: 11px; margin-top: 3px; opacity: .85; }
  .bk .pb { height: 7px; border-radius: 999px; background: rgba(0,0,0,.3); margin-top: 8px; overflow: hidden; }
  .bk .pb > div { height: 100%; border-radius: 999px; background: #ffd1e0; }

  
  /* 일괄 입력 창 */
  dialog { border: none; border-radius: 24px; padding: 20px; width: min(340px, 92vw); box-shadow: 0 12px 40px rgba(0, 0, 0, .6); background: var(--card); color: var(--ink); font-family: inherit; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog h3 { margin: 0 0 12px; font-size: 18px; }
  dialog .lbl { font-size: 13px; color: var(--sub); margin: 12px 0 5px; }
  dialog .pair { display: flex; gap: 6px; }
  dialog select, dialog input { flex: 1; min-width: 0; max-width: none; width: 100%; font-family: inherit; font-size: 16px; padding: 9px 10px; border-radius: 14px; border: 2px solid var(--line); background: #1b1726; color: var(--ink); box-shadow: none; }
  dialog .hint { font-size: 12px; color: var(--sub); margin-top: 12px; line-height: 1.5; min-height: 36px; }
  dialog .row { display: flex; gap: 8px; margin-top: 14px; }
  dialog .row button { flex: 1; box-shadow: none; }
  dialog .ok { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>

<body>
<header>
  <h1>🌸 성경 읽기 체크</h1>
  <select id="bookSel"></select>
  <span class="spacer"></span>
  <button id="bulkBtn" class="mini-btn">일괄 입력</button>
  <button id="authBtn" class="mini-btn">구글 로그인</button>
  <span id="syncStatus" style="font-size:12px; color:var(--sub); margin-left:4px;"></span>

<!-- 한 권 보기 -->

  <div class="bar"><div id="barFill"></div></div>
  <div class="jump" id="jump"></div>
  <div id="chapters"></div>
  <div class="bottom-space"></div>
</div>

<!-- 전체 현황 -->
<div id="allView" style="display:none">
  <div class="total">

    <div class="sub" id="totalSub"></div>
    <div class="bar"><div id="totalBar"></div></div>
  </div>
  <div class="group-title">🌿 구약</div>
  <div class="books" id="otBooks"></div>
  <div class="group-title">🌷 신약</div>
  <div class="books" id="ntBooks"></div>
  <div class="bottom-space"></div>
</div>

<dialog id="bulkDlg">
  <h3>📝 일괄 입력</h3>
  <div class="lbl">시작 (이 장부터)</div>
  <div class="pair">
    <select id="bulkFromBook"></select>
    <select id="bulkFromCh" style="max-width:90px"></select>
  </div>
  <div class="lbl">끝 (이 장까지 포함)</div>
  <div class="pair">
    <select id="bulkToBook"></select>
    <select id="bulkToCh" style="max-width:90px"></select>
  </div>
  <div class="lbl">읽은 횟수 (0이면 이 범위 기록 지우기)</div>
  <input type="number" id="bulkCount" min="0" inputmode="numeric" value="1">
  <div class="hint" id="bulkHint"></div>
  <div class="row">
    <button id="bulkCancel">취소</button>
    <button id="bulkOk" class="ok">적용</button>
  </div>
</dialog>

function scheduleCloudSync() {
  if (!currentUser || isRemoteUpdating) return;
  setStatus('☁️ 저장 중...', '#ffc09f');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try {
      const userDocRef = doc(db, 'users', currentUser.uid);
      await setDoc(userDocRef, {
        checks: data,
        updatedAt: Date.now()
      }, { merge: true });
      setStatus('☁️ 저장 완료', '#94d82d');
    } catch (err) {
      console.error('동기화 오류:', err);
      setStatus('⚠️ 저장 실패', '#ff8787');
    }
  }, 1000);
}

  localStorage.setItem(KEY, JSON.stringify(data));
  scheduleCloudSync();
};

    s.style.color = COLORS[i].fg;
    s.textContent = i === 10 ? '10+' : i;
    lg.appendChild(s);
  }
})();

// ===== 통계 계산 =====
function chapterStats(b, ci) {
  const cnt = BIBLE[b][1][ci];
  let read = 0, min = Infinity, sum = 0;
  for (let v = 1; v <= cnt; v++) {
    const n = getCount(b, ci, v);
    if (n > 0) read++;
    if (n < min) min = n;
    sum += n;
  }
  const completedRounds = min === Infinity ? 0 : min;
  // 현재 진행 중인 회차에서 읽은 절 수
  let currentRoundRead = 0;
  for (let v = 1; v <= cnt; v++) {
    if (getCount(b, ci, v) > completedRounds) currentRoundRead++;
  }
  return {
    read,
    total: cnt,
    min: completedRounds,
    completedRounds,
    currentRoundRead,
    sum
  };
}

function bookStats(b) {
  let read = 0, total = 0, min = Infinity, sum = 0;
  BIBLE[b][1].forEach((_, ci) => {
    const s = chapterStats(b, ci);
    read += s.read; total += s.total; sum += s.sum;
    if (s.min < min) min = s.min;
  });
  const completedRounds = min === Infinity ? 0 : min;
  // 전체 권 기준, 현재 회차(completedRounds + 1 회차)에서 읽은 절 수
  let currentRoundRead = 0;
  BIBLE[b][1].forEach((cnt, ci) => {
    for (let v = 1; v <= cnt; v++) {
      if (getCount(b, ci, v) > completedRounds) currentRoundRead++;
    }
  });

  return {
    read,
    total,
    min: completedRounds,
    completedRounds,
    currentRoundRead,
    sum
  };
}

// ===== 한 권 보기 =====
function paint(el, n) {
  const c = colorOf(n);
  el.style.background = c.bg;
  el.style.color = c.fg;
  el.querySelector('.c').textContent = n > 0 ? n : '';
}

// 칸은 모양만 만든다. 터치는 아래 '쓸어서 체크' 처리가 한 곳에서 받는다.
function makeVerse(b, ci, v) {
  const el = document.createElement('div');
  el.className = 'v';
  el.dataset.b = b;
  el.dataset.ci = ci;
  el.dataset.v = v;
  el.innerHTML = `<div class="n">${v}</div><div class="c"></div>`;
  paint(el, getCount(b, ci, v));
  return el;
}

// ===== 쓸어서 여러 칸 체크 =====
// 톡 누르기: 1회 추가 / 길게 누르기: 1회 차감 / 쓸기: 지나간 칸마다 1회 추가(한 번 쓸 때 칸당 한 번)
(function setupSwipe() {
  const root = document.getElementById('chapters');
  let down = false, moved = false, long = false, timer = null;
  let startEl = null, startX = 0, startY = 0, lastEl = null;
  let touched = new Set();
  const MOVE_LIMIT = 10; // 이만큼 움직이면 쓸기로 본다(px)

  const verseAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('.v') : null;
  };
  const idOf = el => `${el.dataset.b}.${el.dataset.ci}.${el.dataset.v}`;

  function bump(el) {
    const id = idOf(el);
    if (touched.has(id)) return;
    touched.add(id);
    const b = Number(el.dataset.b), ci = Number(el.dataset.ci), v = Number(el.dataset.v);
    const n = getCount(b, ci, v) + 1;
    setCount(b, ci, v, n);
    paint(el, n);
    refreshChapterHeader(ci);
    renderBookSummary();
  }

  // 시작 칸과 끝 칸 사이에 빠르게 지나간 칸도 놓치지 않도록 순서대로 채운다
  function bumpBetween(a, z) {
    const all = Array.from(root.querySelectorAll('.v'));
    const i = all.indexOf(a), j = all.indexOf(z);
    if (i < 0 || j < 0) { bump(z); return; }
    const lo = Math.min(i, j), hi = Math.max(i, j);
    for (let k = lo; k <= hi; k++) bump(all[k]);
  }

  function begin(x, y) {
    const el = verseAt(x, y);
    if (!el) return false;
    down = true; moved = false; long = false;
    startEl = el; lastEl = el; startX = x; startY = y;
    touched = new Set();
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (moved) return;
      long = true;
      const b = Number(el.dataset.b), ci = Number(el.dataset.ci), v = Number(el.dataset.v);
      // 길게 누르면 그 칸의 횟수를 1회 차감(0 아래로는 내려가지 않음)
      const n = Math.max(0, getCount(b, ci, v) - 1);
      setCount(b, ci, v, n);
      paint(el, n);
      refreshChapterHeader(ci);
      renderBookSummary();
      if (navigator.vibrate) navigator.vibrate(15);
    }, 500);
    return true;
  }

  function move(x, y) {
    if (!down || long) return;
    if (!moved) {
      if (Math.abs(x - startX) + Math.abs(y - startY) < MOVE_LIMIT) return;
      moved = true;
      clearTimeout(timer);
      bump(startEl); // 쓸기가 시작되면 처음 칸도 체크
    }
    const el = verseAt(x, y);
    if (el && el !== lastEl) {
      bumpBetween(lastEl, el);
      lastEl = el;
    }
  }

  function finish() {
    if (!down) return;
    clearTimeout(timer);
    if (!moved && !long) bump(startEl); // 그냥 톡 누른 경우
    down = false; moved = false; long = false;
    startEl = null; lastEl = null;
  }

  // 아이패드(터치)
  root.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (begin(t.clientX, t.clientY)) e.preventDefault();
  }, {passive: false});
  root.addEventListener('touchmove', e => {
    if (!down) return;
    e.preventDefault(); // 쓸 때는 화면이 스크롤되지 않게
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, {passive: false});
  root.addEventListener('touchend', e => { if (down) { e.preventDefault(); finish(); } }, {passive: false});
  root.addEventListener('touchcancel', finish);

  // 마우스(컴퓨터에서 확인할 때)
  root.addEventListener('mousedown', e => { begin(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if (down) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', finish);
  root.addEventListener('contextmenu', e => e.preventDefault());
})();

function renderBookSummary() {
  const s = bookStats(book);
  const name = BIBLE[book][0];
  const rounds = s.completedRounds;
  
  if (rounds > 0 && s.currentRoundRead === 0) {
    // 직전 회독을 딱 100% 채운 완료 상태 유지
    $('summary').textContent = `${name} [${rounds}독 완독 ✨] · ${s.total}/${s.total}절 (100%) · 누적 ${s.sum}회`;
    $('barFill').style.width = '100%';
  } else {
    const targetRound = rounds + 1;
    const pct = s.total ? Math.round(s.currentRoundRead / s.total * 100) : 0;
    if (rounds > 0) {
      $('summary').textContent = `${name} [${rounds}독] · ${targetRound}독째 ${s.currentRoundRead}/${s.total}절 (${pct}%) · 누적 ${s.sum}회`;
    } else {
      $('summary').textContent = `${name} · ${s.currentRoundRead}/${s.total}절 (${pct}%) · 누적 ${s.sum}회`;
    }
    $('barFill').style.width = pct + '%';
  }
}

function refreshChapterHeader(ci) {
  const s = chapterStats(book, ci);
  const mini = document.getElementById('mini-' + ci);
  if (mini) mini.textContent = `${s.read}/${s.total}절`;
  const jb = document.getElementById('jb-' + ci);
  if (jb) {
    const c = colorOf(s.min);
    jb.style.background = c.bg;
    jb.style.color = c.fg;
  }
}

function renderBook() {
  const [name, chapters] = BIBLE[book];
  const jump = $('jump');
  const box = $('chapters');
  jump.innerHTML = '';
  box.innerHTML = '';

  chapters.forEach((cnt, ci) => {
    const jb = document.createElement('div');
    jb.className = 'jb';
    jb.id = 'jb-' + ci;
    jb.textContent = ci + 1;
    jb.onclick = () => {
      document.getElementById('ch-' + ci).scrollIntoView({behavior: 'smooth'});
    };
    jump.appendChild(jb);

    const sec = document.createElement('div');
    sec.className = 'chapter';
    sec.id = 'ch-' + ci;
    sec.innerHTML = `<h2>${name} ${ci + 1}장 <span class="mini" id="mini-${ci}"></span></h2>`;
    const grid = document.createElement('div');
    grid.className = 'verses';
    for (let v = 1; v <= cnt; v++) {
      grid.appendChild(makeVerse(book, ci, v));
    }
    sec.appendChild(grid);
    box.appendChild(sec);
    refreshChapterHeader(ci);
  });
  renderBookSummary();
}

// ===== 전체 현황 =====
function renderAll() {
  let gRead = 0, gTotal = 0, gSum = 0, booksDone = 0;
  const ot = $('otBooks'), nt = $('ntBooks');
  ot.innerHTML = ''; nt.innerHTML = '';

  BIBLE.forEach((b, bi) => {
    const s = bookStats(bi);
    gRead += s.read; gTotal += s.total; gSum += s.sum;
    if (s.completedRounds > 0) booksDone++;

    const rounds = s.completedRounds;
    const targetRound = rounds + 1;
    const pct = s.total ? Math.round(s.currentRoundRead / s.total * 100) : 0;
    const c = colorOf(s.min);

    let titleText = b[0];
    if (rounds > 0) {
      titleText += ` <span style="font-size:12px; font-weight:normal; background:rgba(255,255,255,0.2); padding:1px 6px; border-radius:999px;">${rounds}독</span>`;
    }

    let statusText = '';
    let barWidth = 0;
    if (rounds > 0 && s.currentRoundRead === 0) {
      statusText = `100% · ${s.total}/${s.total}절 완독`;
      barWidth = 100;
    } else if (rounds > 0) {
      statusText = `${targetRound}독째 ${pct}% (${s.currentRoundRead}/${s.total}절)`;
      barWidth = pct;
    } else {
      statusText = `${pct}% · ${s.read}/${s.total}절`;
      barWidth = pct;
    }

    const el = document.createElement('div');
    el.className = 'bk';
    el.style.background = c.bg;
    el.style.color = c.fg;
    el.innerHTML = `<div class="t">${titleText}</div>` +
      `<div class="s">${statusText}</div>` +
      `<div class="pb"><div style="width:${barWidth}%"></div></div>`;
    el.onclick = () => {
      book = bi;
      bookSel.value = bi;
      localStorage.setItem('lastBook', bi);
      showTab('book');
      renderBook();
      window.scrollTo(0, 0);
    };
    (bi < OT_COUNT ? ot : nt).appendChild(el);
  });

  const pct = gTotal ? (gRead / gTotal * 100) : 0;
  $('totalBig').textContent = `성경 전체 ${pct.toFixed(1)}% 읽었어요 ✨`;
  $('totalSub').textContent = `${gRead.toLocaleString()} / ${gTotal.toLocaleString()}절 · 1독 이상 완독 ${booksDone}/66 · 누적 ${gSum.toLocaleString()}회`;
  $('totalBar').style.width = pct + '%';
}

function showTab(t) {
  $('bookView').style.display = t === 'book' ? '' : 'none';
  $('allView').style.display = t === 'all' ? '' : 'none';
  $('tabBook').classList.toggle('on', t === 'book');
  $('tabAll').classList.toggle('on', t === 'all');
  if (t === 'all') renderAll();
}

// ===== 일괄 입력 =====
// 시작 장부터 끝 장까지(끝 장 포함) 모든 절을 입력한 횟수로 맞춘다. 0이면 그 범위의 기록을 지운다.
const bulkEls = {
  fromBook: $('bulkFromBook'), fromCh: $('bulkFromCh'),
  toBook: $('bulkToBook'), toCh: $('bulkToCh'),
  count: $('bulkCount'), hint: $('bulkHint')
};
function fillBookSelect(sel) {
  BIBLE.forEach((b, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = b[0];
    sel.appendChild(o);
  });
}
function fillChapterSelect(chSel, bookIdx, keep) {
  const n = BIBLE[bookIdx][1].length;
  chSel.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = (i + 1) + '장';
    chSel.appendChild(o);
  }
  chSel.value = Math.min(keep || 0, n - 1);
}
// 범위 안의 모든 절 좌표를 순서대로 돌려준다
function bulkRange() {
  const fb = Number(bulkEls.fromBook.value), fc = Number(bulkEls.fromCh.value);
  const tb = Number(bulkEls.toBook.value), tc = Number(bulkEls.toCh.value);
  const list = [];
  if (fb > tb || (fb === tb && fc > tc)) return null; // 시작이 끝보다 뒤
  for (let b = fb; b <= tb; b++) {
    const chs = BIBLE[b][1];
    const c0 = b === fb ? fc : 0;
    const c1 = b === tb ? tc : chs.length - 1;
    for (let c = c0; c <= c1; c++) {
      for (let v = 1; v <= chs[c]; v++) list.push([b, c, v]);
    }
  }
  return list;
}
function updateBulkHint() {
  const list = bulkRange();
  const cnt = Math.max(0, parseInt(bulkEls.count.value, 10) || 0);
  if (!list) { bulkEls.hint.textContent = '시작이 끝보다 뒤에 있어요. 순서를 확인해 주세요.'; return; }
  const f = `${BIBLE[bulkEls.fromBook.value][0]} ${Number(bulkEls.fromCh.value) + 1}장`;
  const t = `${BIBLE[bulkEls.toBook.value][0]} ${Number(bulkEls.toCh.value) + 1}장`;
  bulkEls.hint.textContent = cnt === 0
    ? `${f} ~ ${t} (${list.length.toLocaleString()}절)의 기록을 지웁니다.`
    : `${f} ~ ${t} (${list.length.toLocaleString()}절)을 모두 ${cnt}회로 설정합니다. 기존 횟수는 덮어씁니다.`;
}
fillBookSelect(bulkEls.fromBook);
fillBookSelect(bulkEls.toBook);
fillChapterSelect(bulkEls.fromCh, 0, 0);
fillChapterSelect(bulkEls.toCh, 0, 0);
bulkEls.fromBook.onchange = () => { fillChapterSelect(bulkEls.fromCh, Number(bulkEls.fromBook.value), 0); updateBulkHint(); };
bulkEls.toBook.onchange = () => { fillChapterSelect(bulkEls.toCh, Number(bulkEls.toBook.value), 0); updateBulkHint(); };
[bulkEls.fromCh, bulkEls.toCh].forEach(s => s.onchange = updateBulkHint);
bulkEls.count.oninput = updateBulkHint;

$('bulkBtn').onclick = () => {
  // 지금 보고 있는 권을 기본값으로
  bulkEls.fromBook.value = book; bulkEls.toBook.value = book;
  fillChapterSelect(bulkEls.fromCh, book, 0);
  fillChapterSelect(bulkEls.toCh, book, BIBLE[book][1].length - 1);
  bulkEls.count.value = 1;
  updateBulkHint();
  $('bulkDlg').showModal();
};
$('bulkCancel').onclick = () => $('bulkDlg').close();
$('bulkOk').onclick = () => {
  const list = bulkRange();
  if (!list) { alert('시작이 끝보다 뒤에 있어요. 순서를 확인해 주세요.'); return; }
  const cnt = Math.max(0, parseInt(bulkEls.count.value, 10) || 0);
  const msg = cnt === 0
    ? `${list.length.toLocaleString()}절의 기록을 지웁니다. 계속할까요?`
    : `${list.length.toLocaleString()}절을 모두 ${cnt}회로 바꿉니다. 계속할까요?`;
  if (!confirm(msg)) return;
  list.forEach(([b, c, v]) => {
    const key = k(b, c, v);
    if (cnt <= 0) delete data[key]; else data[key] = cnt;
  });
  save(); // 한 번에 저장
  $('bulkDlg').close();
  renderBook();
  if ($('allView').style.display !== 'none') renderAll();
};

// ===== 이벤트 =====
bookSel.onchange = () => {
  book = Number(bookSel.value);
  localStorage.setItem('lastBook', book);
  showTab('book');
  renderBook();
  window.scrollTo(0, 0);
};
$('tabBook').onclick = () => { showTab('book'); };
$('tabAll').onclick = () => { showTab('all'); };

// 구글 로그인 및 실시간 동기화 리스너
authBtn.onclick = async () => {
  if (currentUser) {
    if (confirm('로그아웃 하시겠습니까?')) {
      await signOut(auth);
    }
  } else {
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      console.error('로그인 실패:', err);
      alert('로그인에 실패했습니다. 승인된 도메인을 확인해 주세요.');
    }
  }
};

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (unsubscribeSnapshot) {
    unsubscribeSnapshot();
    unsubscribeSnapshot = null;
  }

  if (user) {
    authBtn.textContent = '로그아웃';
    setStatus('☁️ 동기화 중...', '#ffc09f');
    const userDocRef = doc(db, 'users', user.uid);

    // 실시간 구독: 다른 기기(폰/패드)에서 체크하면 즉시 화면에 자동 반영
    unsubscribeSnapshot = onSnapshot(userDocRef, docSnap => {
      if (docSnap.exists()) {
        const cloudData = docSnap.data().checks || {};
        // 로컬 데이터와 클라우드 데이터 병합
        const merged = { ...data, ...cloudData };
        isRemoteUpdating = true;
        data = merged;
        localStorage.setItem(KEY, JSON.stringify(data));
        isRemoteUpdating = false;

        renderBook();
        if ($('allView').style.display !== 'none') renderAll();
        setStatus('☁️ 동기화됨', '#94d82d');
      } else {
        // 클라우드에 아직 기록이 없으면 현재 로컬 기록을 클라우드로 최초 업로드
        scheduleCloudSync();
      }
    }, err => {
      console.error('실시간 동기화 오류:', err);
      setStatus('⚠️ 동기화 오류', '#ff8787');
    });
  } else {
    authBtn.textContent = '구글 로그인';
    setStatus('');
  }
});

// 시작
bookSel.value = book;
renderBook();
</script>
